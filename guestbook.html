<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한 줄 방명록</title>
<style>body{font-family:system-ui,sans-serif;margin:0;background:#f3f6fa;color:#172638}main{max-width:640px;margin:48px auto;padding:24px}a{color:#075ea8}form,article{background:white;border:1px solid #d9e2ed;border-radius:12px;padding:20px;margin:16px 0}label{display:block;margin:12px 0 6px}input{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #aab8c8;border-radius:6px}button{font:inherit;background:#075ea8;color:white;border:0;border-radius:6px;padding:12px 20px;margin-top:16px;cursor:pointer}button:disabled{opacity:.6}p{line-height:1.6;overflow-wrap:anywhere}time,small{color:#536579}h1{margin-bottom:8px}</style></head>
<body><main><a href="/">← 공휴일 조회</a><h1>한 줄 방명록</h1><p>오늘의 한마디를 남겨주세요. 작성한 글은 누구나 볼 수 있습니다.</p>
<form id="form"><label for="nickname">별명</label><input id="nickname" name="nickname" maxlength="20" required autocomplete="nickname"><label for="message">한 줄 메시지</label><input id="message" name="message" maxlength="200" required><small>별명 20자 · 메시지 200자 이내. 개인정보는 적지 마세요.</small><br><button id="submit">남기기</button></form>
<p id="status" role="status" aria-live="polite"></p><button id="reload" type="button">새로고침</button><section id="entries" aria-label="최근 방명록"></section></main>
<script>
const form=document.querySelector('#form'),status=document.querySelector('#status'),entries=document.querySelector('#entries'),submit=document.querySelector('#submit');
function render(rows){entries.replaceChildren();for(const row of rows){const article=document.createElement('article'),name=document.createElement('strong'),message=document.createElement('p'),time=document.createElement('time');name.textContent=row.nickname;message.textContent=row.message;time.dateTime=row.created_at;time.textContent=new Date(row.created_at).toLocaleString('ko-KR');article.append(name,message,time);entries.append(article);}}
async function load(){status.textContent='방명록을 불러오는 중…';try{const res=await fetch('/api/guestbook');const data=await res.json();if(!res.ok)throw new Error(data.error);render(data.entries);status.textContent=data.entries.length?'최근 '+data.entries.length+'개의 글입니다.':'아직 글이 없습니다. 첫 한 줄을 남겨주세요.';}catch(error){status.textContent=error.message||'불러오지 못했습니다. 다시 시도해주세요.';}}
form.addEventListener('submit',async(event)=>{event.preventDefault();submit.disabled=true;status.textContent='저장하는 중…';try{const res=await fetch('/api/guestbook',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nickname:form.nickname.value,message:form.message.value})});const data=await res.json();if(!res.ok)throw new Error(data.error);form.message.value='';await load();status.textContent='한 줄을 저장했습니다.';}catch(error){status.textContent=error.message||'저장하지 못했습니다. 다시 시도해주세요.';}finally{submit.disabled=false;}});
document.querySelector('#reload').addEventListener('click',load);load();
</script></body></html>
